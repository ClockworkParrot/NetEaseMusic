name: Build Packages

# 手动触发，或推送 v* 标签时自动构建三平台安装包并上传 GitHub Release
on:
  workflow_dispatch:
    inputs:
      version:
        description: 版本号（tag 触发时忽略；分支手动触发时使用，默认 1.0.0）
        required: false
        default: "1.0.0"
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  deb-linux:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: 安装系统依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libpulse0 libpulse-mainloop-glib0 libgstreamer1.0-0 \
            gstreamer1.0-plugins-base gstreamer1.0-plugins-good
      - name: 安装 Python 依赖
        run: pip install -r requirements.txt pyinstaller pysocks
      - name: 构建 deb
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then V="${GITHUB_REF_NAME#v}"; else V="${{ inputs.version || '1.0.0' }}"; fi
          bash packaging/build_deb.sh "$V"
      - uses: actions/upload-artifact@v4
        with:
          name: deb-amd64
          path: dist_deb/*.deb

  exe-windows:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: 安装 Python 依赖
        run: pip install -r requirements.txt pyinstaller pysocks
      - name: 构建 exe
        run: >
          python -m PyInstaller --noconfirm --clean --noconsole --onefile
          --name NetEaseMusic
          --icon packaging/icon.ico
          --hidden-import socks --hidden-import sockshandler
          main.py
      - uses: actions/upload-artifact@v4
        with:
          name: exe-win64
          path: dist/NetEaseMusic.exe

  app-macos:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: 安装系统依赖
        run: brew install gstreamer ffmpeg || true
      - name: 安装 Python 依赖
        run: pip install -r requirements.txt pyinstaller pysocks
      - name: 构建 .app
        run: bash packaging/build_mac.sh
      - name: 压缩 .app
        run: cd dist && zip -qry NetEaseMusic-macOS.zip NetEaseMusic.app
      - uses: actions/upload-artifact@v4
        with:
          name: app-macos
          path: dist/NetEaseMusic-macOS.zip

  # 打 tag 触发时：汇总三平台产物发布 GitHub Release
  # （Release 附件可经镜像站加速下载，api 的 artifacts 不能）
  release:
    needs: [deb-linux, exe-windows, app-macos]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: 发布 Release
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "NetEase Music Downloader $GITHUB_REF_NAME" \
            --notes "安装包：deb (Linux amd64) / exe (Windows) / zip (macOS app)" \
            --verify-tag \
            artifacts/deb-amd64/*.deb \
            artifacts/exe-win64/*.exe \
            artifacts/app-macos/*.zip \
          || gh release upload "$GITHUB_REF_NAME" \
            artifacts/deb-amd64/*.deb \
            artifacts/exe-win64/*.exe \
            artifacts/app-macos/*.zip --clobber
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
